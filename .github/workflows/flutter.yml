name: 检查与构建 APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 检查和测试
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 检查代码
        run: flutter analyze

      - name: 运行测试
        run: flutter test

  build-apk:
    name: 构建 arm64 APK
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建仅支持 arm64 的 APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: 整理 APK 文件名
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk TJ-Class-Schedule-arm64-v8a.apk

      - name: 保存 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TJ-Class-Schedule-arm64-v8a
          path: TJ-Class-Schedule-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TJ-Class-Schedule-arm64-v8a.apk
          generate_release_notes: true
